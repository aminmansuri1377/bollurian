[package]
name = "price-manager"
version = "0.1.0"
description = "Offline Price Manager MVP"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "price_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
